<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQ 桥接 · 控制台</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f7f5; --panel: #fff; --panel-2: #f7f9f7; --ink: #24322e;
  --ink2: #74817b; --ink3: #8b9690; --line: #e8ece8; --line2: #dce3dd;
  --soft: #f0f4f0; --soft2: #e8eeea; --accent: #2d7861; --accent-ink: #23634f;
  --accent-weak: #e9f3ed; --danger: #bb5b52; --ok: #3c916b; --warn: #b18448;
  --radius: 16px; --radius-sm: 9px; --shadow: 0 2px 5px #20372a02;
  --hero: #e9f1eb; --hero-ink: #285b47;
}
* { box-sizing: border-box; }
html { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.65 "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; -webkit-font-smoothing: antialiased; }
::selection { background: var(--accent-weak); color: var(--accent-ink); }
*::-webkit-scrollbar { width: 7px; height: 7px; }
*::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { display: inline-flex; justify-content: center; align-items: center; gap: 7px; cursor: pointer; border: 1px solid var(--line2); background: var(--panel); border-radius: var(--radius-sm); padding: 9px 15px; font-size: 13px; line-height: 1.5; transition: background .16s, border-color .16s, color .16s; }
button:hover:not(:disabled) { background: var(--soft); border-color: var(--ink3); }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 3px; }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.primary:hover:not(:disabled) { background: var(--accent-ink); border-color: var(--accent-ink); }
button.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 23%, var(--panel)); }
button.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 7%, var(--panel)); border-color: var(--danger); }
button.ghost { background: transparent; border-color: transparent; }
button.small { padding: 6px 11px; font-size: 12px; border-radius: 7px; }
a { color: var(--accent); text-decoration: none; }
.ui-icon { width: 18px; height: 18px; flex: none; }
.app { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }
.side { height: 100vh; position: sticky; top: 0; display: flex; flex-direction: column; padding: 31px 17px 17px; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 9px; color: var(--ink); margin-bottom: 42px; }
.logo { width: 39px; height: 40px; display: grid; place-items: center; background: var(--accent); border-radius: 12px; color: #fff; flex: none; }
.logo svg { width: 26px; height: 26px; }
.brandText { display: flex; flex-direction: column; }
.brandText b { font-size: 18px; letter-spacing: .02em; font-weight: 650; }
.brandText > span { font-size: 10px; color: var(--ink2); letter-spacing: .04em; margin-top: 1px; }
.nav-label { padding: 0 14px; color: var(--ink3); font-size: 11px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; letter-spacing: .1em; }
.nav-label #ver { font-size: 10px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.nav { display: flex; flex-direction: column; gap: 7px; }
.tab { justify-content: flex-start; gap: 13px; padding: 13px 13px; text-align: left; width: 100%; border: 0; background: transparent; border-radius: 10px; color: var(--ink2); }
.tab > .ui-icon { width: 19px; height: 19px; margin-top: -12px; }
.tab > span:not(.nav-arrow) { display: flex; flex: 1; flex-direction: column; gap: 3px; }
.tab b { font-weight: 550; font-size: 13px; }
.tab small { font-size: 10px; opacity: .8; letter-spacing: .01em; font-weight: 400; }
.tab .nav-arrow { font-size: 17px; opacity: 0; }
.tab.on { background: var(--accent-weak); border-color: color-mix(in srgb, var(--accent) 9%, transparent); color: var(--accent); }
.tab.on .nav-arrow { opacity: 1; }
.tab:hover:not(:disabled) { border-color: transparent; }
.tab.on:hover:not(:disabled) { background: var(--accent-weak); }
.side-guide { margin: 36px 14px 30px; color: var(--ink2); }
.guide-line { display: block; height: 2px; width: 25px; background: var(--accent); opacity: .5; margin-bottom: 16px; }
.side-guide b { font-size: 12px; font-weight: 500; }
.side-guide p { font-size: 11px; line-height: 1.9; color: var(--ink3); margin: 7px 0 0; }
.sidefoot { margin-top: auto; padding-top: 18px; }
.side-persona { display: flex; padding: 12px 9px; border: 0; width: 100%; justify-content: flex-start; gap: 10px; background: var(--panel-2); border-radius: 11px; }
.side-persona > span:nth-child(2) { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
.side-persona b { font-size: 12px; font-weight: 550; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 136px; }
.side-persona small { font-size: 10px; color: var(--ink3); }
.tiny-avatar { flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: #e1ede5; color: #4a7e64; }
.tiny-avatar svg { width: 22px; height: 22px; }
.side-chevron { margin-left: auto; color: var(--ink3); }
.statusbox { display: flex; flex-direction: column; gap: 7px; padding: 16px 12px 0; }
.pill { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; color: var(--ink2); }
.dot, .status-dot { display: inline-block; height: 6px; width: 6px; border-radius: 50%; background: var(--ink3); flex: none; }
.status-dot.online { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 9%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { font-size: 10px; color: var(--ink3); }
.chip + .chip::before { content: '·'; margin-right: 7px; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); padding: 0 36px; background: color-mix(in srgb, var(--panel) 70%, var(--bg)); }
.breadcrumb { display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--ink3); white-space: nowrap; }
.breadcrumb b { font-weight: 500; color: var(--ink); }
.top-actions { display: flex; align-items: center; gap: 10px; }
.feature-search { display: flex; align-items: center; position: relative; width: 240px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 10px; gap: 9px; }
.feature-search > svg { width: 15px; height: 15px; color: var(--ink3); flex: none; }
.feature-search input { padding: 0; border: 0; background: transparent; font-size: 11px; min-width: 0; border-radius: 0; }
.feature-search input:focus { box-shadow: none; background: transparent; }
.feature-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
.feature-search kbd { flex: none; font: 9px "Segoe UI", sans-serif; padding: 0 4px; border: 1px solid var(--line); color: var(--ink3); border-radius: 3px; white-space: nowrap; }
.icon-button, .refresh-button { height: 34px; padding: 7px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-size: 11px; }
.refresh-button .ui-icon, .icon-button .ui-icon { width: 14px; height: 14px; }
#refreshIcon { display: flex; }
.refreshing #refreshIcon { animation: spin 1s linear infinite; }
.search-results { position: absolute; top: calc(100% + 9px); right: 0; width: 340px; max-height: 460px; overflow-y: auto; padding: 8px; background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; box-shadow: 0 16px 45px #142a2020; z-index: 50; }
.search-results[hidden] { display: none; }
.search-heading { padding: 6px 8px 10px; color: var(--ink3); font-size: 11px; display: flex; justify-content: space-between; }
.search-result { display: flex; width: 100%; text-align: left; gap: 12px; border: 0; padding: 10px; }
.search-result > span:first-child { color: var(--accent); }
.search-result > span:nth-child(2) { display: flex; flex-direction: column; flex: 1; gap: 1px; }
.search-result b { font-size: 12px; font-weight: 500; }
.search-result small { color: var(--ink3); font-size: 10px; }
.search-result > .ui-icon { width: 14px; color: var(--ink3); }
.search-empty { padding: 20px 10px; font-size: 12px; color: var(--ink2); }
.maininner { max-width: 1300px; width: 100%; margin: 0 auto; padding: 32px 36px 28px; flex: 1; min-width: 0; }
.pagehead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; gap: 20px; }
.page-eyebrow { font-size: 9px; letter-spacing: .18em; color: var(--ink3); margin-bottom: 5px; text-transform: uppercase; }
.pagehead h1 { font-size: 25px; line-height: 1.5; margin: 0 0 5px; letter-spacing: .01em; font-weight: 620; }
.pagehead p { margin: 0; color: var(--ink2); font-size: 12px; line-height: 1.8; }
.page-decoration { display: grid; place-items: center; border: 1px solid var(--line2); color: var(--accent); border-radius: 13px; height: 43px; width: 43px; background: var(--panel); }
.page-decoration svg { height: 20px; width: 20px; }
.subnav { display: flex; align-items: center; flex-wrap: wrap; gap: 20px; border-bottom: 1px solid var(--line2); margin: -5px 0 25px; }
.subnav button { border: 0; padding: 12px 0; border-radius: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--ink2); margin-bottom: -1px; font-size: 12px; }
.subnav button.on { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
.subnav button:hover:not(:disabled) { background: transparent; color: var(--accent); }
.page-content { min-width: 0; }
.page-content > .card { max-width: 880px; }
.card { padding: 23px 25px; margin-bottom: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card h2 { margin: 0 0 10px; font-size: 14px; font-weight: 600; letter-spacing: .01em; }
.card h2 + .muted { margin-top: -3px; margin-bottom: 14px; }
.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 17px; flex-wrap: wrap; }
.section-heading h2 { margin: 0; }
.section-heading > .muted { font-size: 10px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; flex-wrap: wrap; }
.row + .row { border-top: 1px solid var(--line); }
.row > * { min-width: 0; }
.row.start { justify-content: flex-start; }
.muted { color: var(--ink2); font-size: 12px; line-height: 1.8; }
.mono { font: 11px/1.8 ui-monospace, Consolas, monospace; color: var(--ink2); overflow-wrap: anywhere; }
.kv { display: flex; flex-direction: column; gap: 6px; padding: 13px 0; min-width: 0; }
.kv > span { color: var(--ink2); font-size: 11px; }
.kv + .kv { border-top: 1px solid var(--line); }
code.path { display: block; font: 11px/1.8 ui-monospace, Consolas, monospace; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 9px 12px; overflow-wrap: anywhere; word-break: break-all; white-space: normal; }
input, textarea, select { font-size: 13px; width: 100%; min-width: 0; background: var(--panel); border: 1px solid var(--line2); border-radius: var(--radius-sm); padding: 10px 12px; outline: none; transition: border-color .16s, box-shadow .16s; }
input::placeholder, textarea::placeholder { color: var(--ink3); opacity: .85; }
input:hover, textarea:hover, select:hover { border-color: var(--ink3); }
input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
textarea { min-height: 104px; resize: vertical; line-height: 1.85; }
input[type="checkbox"] { accent-color: var(--accent); }
input.sharing-switch { appearance:none; width:34px; height:20px; flex:0 0 34px; margin:0; padding:0; border:0; border-radius:12px; cursor:pointer; background:radial-gradient(circle at 10px 50%,#fff 0 6px,transparent 6.5px),var(--ink3); }
input.sharing-switch:checked { background:radial-gradient(circle at 24px 50%,#fff 0 6px,transparent 6.5px),var(--accent); }
input.sharing-switch:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
input[type="file"] { font-size: 12px; background: var(--panel-2); border-style: dashed; }
input[type="file"]::file-selector-button { border: 0; background: var(--soft2); color: var(--ink); border-radius: 5px; padding: 5px 10px; margin-right: 10px; font: inherit; cursor: pointer; }
label.field { display: block; font-size: 11px; color: var(--ink2); line-height: 1.7; }
label.field > input, label.field > select, label.field > textarea, label.field > button { margin-top: 6px; }
.btnrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; font-size: 10px; padding: 3px 8px; line-height: 1.5; color: var(--ink2); background: var(--soft); border-radius: 5px; font-weight: 400; }
.accent-tag { color: var(--accent); background: var(--accent-weak); }
.persona { background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; padding: 18px; margin-bottom: 11px; }
.persona.on { background: var(--accent-weak); border-color: color-mix(in srgb, var(--accent) 28%, var(--line)); }
.persona h3 { margin: 0 0 3px; font-size: 14px; font-weight: 550; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.persona pre { white-space: pre-wrap; font-size: 12px; font-family: inherit; color: var(--ink2); margin: 9px 0 0; max-height: 140px; overflow-y: auto; line-height: 1.85; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(125px, 1fr)); gap: 13px; }
.sticker { background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; padding: 10px; text-align: center; }
.sticker img { width: 100%; height: 100px; object-fit: contain; margin-top: 9px; border-radius: 7px; }
.sticker .name { font-size: 11px; margin-top: 7px; color: var(--ink2); overflow-wrap: anywhere; }
.sticker .acts { display: flex; gap: 5px; justify-content: center; margin-top: 7px; }
.empty { padding: 37px 15px; text-align: center; border: 1px dashed var(--line2); color: var(--ink3); background: var(--panel-2); border-radius: 11px; font-size: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.empty > .ui-icon { width: 30px; height: 30px; opacity: .5; margin-bottom: 3px; }
.empty b { font-size: 13px; color: var(--ink2); font-weight: 500; }
.empty button { margin-top: 5px; }
.msgs { display: flex; flex-direction: column; gap: 13px; }
.msg { padding: 15px 17px; background: var(--accent-weak); border-radius: 11px; border: 1px solid color-mix(in srgb, var(--accent) 10%, transparent); }
.msg.in { background: var(--panel-2); border-color: var(--line); }
.msg .meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 10px; color: var(--ink3); margin-bottom: 5px; }
.msg .body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.8; }
.msg img { max-width: 180px; border-radius: 9px; margin-top: 8px; }
.banner, .warncard { color: var(--ink2); border: 1px solid color-mix(in srgb, var(--warn) 25%, var(--line)); background: color-mix(in srgb, var(--warn) 5%, var(--panel)); border-radius: 10px; padding: 14px 17px; font-size: 12px; }
.banner b { color: var(--warn); font-weight: 550; }
pre.log { max-height: 480px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 11px/1.9 ui-monospace, Consolas, monospace; background: var(--panel-2); color: var(--ink2); padding: 17px; border: 1px solid var(--line); border-radius: 9px; margin: 12px 0 0; }
.seg { display: inline-flex; padding: 3px; background: var(--soft); border-radius: 8px; }
.seg button { border: 0; background: transparent; font-size: 11px; padding: 5px 12px; border-radius: 6px; }
.seg button.on { background: var(--panel); color: var(--accent); box-shadow: var(--shadow); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--panel-2); border-radius: 9px; padding: 14px; }
.stat b { display: block; font-size: 21px; font-weight: 550; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--ink3); }
.toggle-control { border: 0; background: var(--soft); color: var(--ink2); font-size: 11px; }
.toggle-control::before { content: ''; width: 23px; height: 13px; background: radial-gradient(circle at 6px 50%, #fff 0 4px, transparent 4.5px), var(--ink3); border-radius: 9px; }
.toggle-control[aria-pressed="true"] { color: var(--accent); background: var(--accent-weak); }
.toggle-control[aria-pressed="true"]::before { background: radial-gradient(circle at 17px 50%, #fff 0 4px, transparent 4.5px), var(--accent); }
.toggle-control.primary { border-color: transparent; }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 8px); padding: 12px 21px; background: var(--ink); color: var(--panel); border-radius: 9px; font-size: 12px; opacity: 0; transition: opacity .18s, transform .18s; pointer-events: none; z-index: 100; box-shadow: 0 6px 24px #142a2025; max-width: 86vw; }
.toast.on { transform: translate(-50%, 0); opacity: 1; }
.modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: #102a2045; backdrop-filter: blur(3px); z-index: 99; }
.modal[hidden] { display: none; }
.modalbox { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line2); border-radius: 15px; padding: 25px; box-shadow: 0 18px 60px #102a2030; display: grid; gap: 17px; }
.modalmsg { font-size: 14px; }
.modalbox .btnrow { justify-content: flex-end; }
.app-footer { max-width: 1300px; width: 100%; margin: auto auto 0; display: flex; justify-content: space-between; padding: 13px 36px 22px; color: var(--ink3); font-size: 9px; gap: 10px; }
.footer-separator { opacity: .5; margin: 0 8px; }
.loading-state { padding: 100px 20px; text-align: center; color: var(--ink2); }
.loading-state h1 { font-size: 18px; font-weight: 500; }
.loading-state p { font-size: 12px; }
.loading-dot { display: inline-block; width: 10px; height: 10px; background: var(--accent); border-radius: 50%; animation: pulse 1s ease infinite alternate; }
/* Dashboard */
.dashboard { display: grid; grid-template-columns: minmax(0, 1fr) 285px; gap: 20px; }
.dashboard .card { margin-bottom: 0; }
.welcome { background: var(--hero); border: 1px solid color-mix(in srgb, var(--accent) 8%, transparent); border-radius: var(--radius); padding: 25px 27px 28px; min-width: 0; overflow: hidden; }
.eyebrow { font-size: 9px; font-weight: 500; letter-spacing: .12em; color: var(--ink2); }
.welcome .eyebrow { color: color-mix(in srgb, var(--hero-ink) 60%, transparent); display: flex; align-items: center; gap: 20px; }
.welcome .eyebrow > span { margin-left: auto; letter-spacing: 0; font-size: 10px; white-space: nowrap; }
.welcome-body { display: flex; justify-content: space-between; align-items: center; min-height: 190px; gap: 9px; }
.welcome-body > div:first-child { position: relative; z-index: 1; flex: 1; }
.welcome-status { display: flex; align-items: center; gap: 7px; color: var(--hero-ink); font-size: 10px; margin: 22px 0 10px; }
.welcome h2 { color: var(--hero-ink); font-size: clamp(20px, 1.8vw, 27px); font-weight: 550; margin: 0; line-height: 1.5; letter-spacing: -.02em; }
.welcome p { color: color-mix(in srgb, var(--hero-ink) 65%, transparent); font-size: 11px; margin: 9px 0 23px; }
.welcome .primary { padding: 10px 17px; font-size: 11px; border-radius: 8px; }
.welcome .primary svg { width: 14px; height: 14px; }
.hero-secondary { background: transparent; border: 0; color: var(--hero-ink); font-size: 11px; padding: 9px; }
.hero-secondary svg { width: 14px; }
.bridge-art { flex: none; width: 170px; height: 173px; position: relative; color: var(--accent); }
.orbit { position: absolute; inset: 12px 7px; border: 1px solid color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 50%; transform: rotate(-28deg); }
.orbit-two { inset: 30px -3px; transform: rotate(-28deg); }
.bridge-mark { height: 105px; width: 115px; border-radius: 30px; background: color-mix(in srgb, var(--accent) 10%, var(--hero)); display: grid; place-items: center; position: absolute; top: 36px; left: 27px; transform: rotate(-8deg); border: 1px solid color-mix(in srgb, var(--accent) 15%, transparent); box-shadow: 0 13px 25px -17px #305b4640; }
.bridge-mark svg { width: 85px; height: 68px; color: #579677; }
.float-bubble { display: grid; place-items: center; width: 36px; height: 34px; border: 1px solid color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 11px; background: color-mix(in srgb, var(--panel) 75%, transparent); position: absolute; z-index: 2; box-shadow: 0 4px 12px #305b4608; }
.bubble-one { left: 3px; top: 22px; transform: rotate(-12deg); }
.bubble-two { right: 1px; top: 102px; transform: rotate(11deg); }
.art-caption { position: absolute; bottom: 8px; width: 100%; text-align: center; font: 8px ui-monospace, Consolas, monospace; letter-spacing: .16em; opacity: .6; }
.companion-card { padding: 22px 22px 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
.companion-card .section-heading { width: 100%; margin-bottom: 13px; }
.companion-card .eyebrow { font-size: 10px; letter-spacing: .03em; }
.companion-avatar { height: 64px; width: 64px; border-radius: 50%; display: grid; place-items: center; color: #4c8068; background: #e7efe9; border: 5px solid var(--panel-2); margin: 3px 0 10px; }
.companion-avatar svg { height: 38px; width: 38px; stroke-width: 1.2; }
.companion-card h2 { font-size: 16px; margin: 0 0 4px; }
.companion-card p { margin: 0 0 14px; font-size: 10px; color: var(--ink3); }
.companion-meta { display: flex; justify-content: center; width: 100%; gap: 22px; margin-bottom: 15px; font-size: 10px; color: var(--ink3); }
.companion-meta b { color: var(--ink2); font-weight: 400; margin-left: 5px; }

  function showQrMeta(v) {
    var hint = $('qrAge');
    if (!hint) return;
    var status = String(v.status || '');
    var age = Math.max(0, Math.round(v.ageSeconds || 0));
    var descriptions = { ready: 'QQ 已登录，等待桥接连接。', qrcode_scanned: '二维码已扫码，请在手机 QQ 确认。', generating_qrcode: '正在申请新二维码…', reconnecting: 'QQ 正在重新连接，请稍候…', initializing: 'NapCat 正在初始化，请稍候…', offline: 'QQ 当前离线，请启动 NapCat 或更换二维码。' };
    if (v.error) hint.textContent = '二维码状态：' + v.error;
    else if (v.expired) hint.textContent = '当前二维码已过期，请点击「换一个二维码」。旧图仅供识别，不能继续扫码。';
    else if (descriptions[status]) hint.textContent = descriptions[status];
    else if (v.available === false || !v.exists) hint.textContent = '还没有可扫描的二维码，请先启动 NapCat。启动后会自动读取二维码。';
    else hint.textContent = '二维码更新于 ' + age + ' 秒前，请用手机 QQ 扫码并确认登录。';
    hint.style.color = v.error || v.expired ? 'var(--danger)' : 'var(--ink3)';
    var box = $('qrBox');
    if (box) {
      box.setAttribute('data-qr-status', v.expired ? 'expired' : (v.available === false ? 'unavailable' : (status || 'available')));
      var image = box.querySelector('img');
      if (image) { image.style.opacity = v.expired || v.available === false ? '0.35' : '1'; image.title = v.expired ? '二维码已过期，请换一个二维码' : '手机 QQ 扫码登录'; }
    }
  }

  async function paintQr(force) {
    var box = $('qrBox');
    if (!box) return;
    var serial = ++qrReadSerial;
    function current() { return serial === qrReadSerial && box.isConnected && $('qrBox') === box; }
    try {
      var meta = await api('GET', '/im-bridge/qr/meta');
      if (!current()) return;
      showQrMeta(meta);
      if (meta.available === false || meta.expired || !meta.exists) {
        if (!box.querySelector('img')) box.innerHTML = '<div class="muted">' + esc(meta.error || (meta.status === 'ready' ? 'QQ 已登录，正在等待桥接连接。' : '等待 NapCat 生成可扫描的二维码…')) + '</div>';
        return;
      }
      var version = String(meta.updatedAt || meta.version || '');
      if (!force && version && box.getAttribute('data-qr-version') === version && box.querySelector('img')) return;
      var response = await fetch('/im-bridge/qr?t=' + Date.now(), { cache: 'no-store' });
      if (!response.ok) {
        var reason = 'HTTP ' + response.status;
        try { var problem = await response.json(); if (problem.error) reason = problem.error; } catch (_) {}
        throw new Error(reason);
      }
      if (!/^image\//i.test(response.headers.get('content-type') || '')) throw new Error('二维码接口未返回图片');
      var blob = await response.blob();
      if (!current()) return;
      var objectUrl = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function () {
        if (!current()) { URL.revokeObjectURL(objectUrl); return; }
        img.style.maxWidth = '220px';
        img.style.borderRadius = '12px';
        img.style.border = '1px solid var(--line)';
        img.alt = 'QQ 登录二维码';
        img.title = '请用手机 QQ 扫码并确认登录';
        box.replaceChildren(img);
        box.setAttribute('data-qr-version', version);
        if (qrObjectUrl) URL.revokeObjectURL(qrObjectUrl);
        qrObjectUrl = objectUrl;
        showQrMeta(meta);
      };
      img.onerror = function () {
        URL.revokeObjectURL(objectUrl);
        if (!current()) return;
        if (!box.querySelector('img')) box.innerHTML = '<div class="muted">二维码图片无法解码，请更换二维码后重试。</div>';
        if ($('qrAge')) { $('qrAge').textContent = '读取二维码失败：图片无法解码'; $('qrAge').style.color = 'var(--danger)'; }
      };
      img.src = objectUrl;
    } catch (error) {
      if (!current()) return;
      if (!box.querySelector('img')) box.innerHTML = '<div class="muted">暂时无法读取二维码。</div>';
      if ($('qrAge')) { $('qrAge').textContent = '读取二维码失败：' + error.message; $('qrAge').style.color = 'var(--danger)'; }
    }
  }

    if($('soulSave'))$('soulSave').onclick=async function(){try{await api('POST','/im-bridge/settings',{mood:{enabled:$('moodEnabled').checked,everyTurns:Number($('moodEvery').value),confidence:Number($('moodConfidence').value),halfLifeHours:Number($('moodDecay').value)},humanism:{enabled:$('humanismEnabled').checked,visual:$('humanismVisual').checked,learning:$('humanismLearning').checked}});toast('情绪与学习设置已保存');await load();}catch(e){toast(e.message);}};
    if($('soulReset'))$('soulReset').onclick=async function(){if(!soulChat)return;const r=await featurePost('companion-state',{key:soulChat,action:'reset-mood'},this);if(r){toast('当前对话心情已回稳');await load();}};
    if($('soulForget'))$('soulForget').onclick=async function(){if(!soulChat)return;const r=await featurePost('companion-state',{key:soulChat,action:'forget-learning'},this);if(r){toast('这些理解不再影响当前对话');await load();}};
    var el;
    if((el=$('mfChat')))el.onchange=function(){rememberDraft('memory');memoryChat=this.value;memoryEditId='';renderPane();};
    Array.prototype.forEach.call(document.querySelectorAll('[data-memory-filter]'),button=>{button.onclick=function(){memoryFilter=button.getAttribute('data-memory-filter');renderPane();};});
    Array.prototype.forEach.call(document.querySelectorAll('[data-memory-edit]'),button=>{button.onclick=function(){rememberDraft('memory');memoryEditId=button.getAttribute('data-memory-edit');renderPane();$('mfText').focus();};});
    if((el=$('mfCancel')))el.onclick=function(){rememberDraft('memory');memoryEditId='';renderPane();};
    if((el=$('mfSave')))el.onclick=async function(){var result=await featurePost('memory',{key:memoryChat,id:memoryEditId,action:'save',text:$('mfText').value,kind:$('mfKind').value,pinned:$('mfPinned').checked},this);if(result){memoryEditId='';toast('记忆已更新，后续对话使用新内容');await load();}};
    ['confirm','pin','delete'].forEach(action=>Array.prototype.forEach.call(document.querySelectorAll('[data-memory-'+action+']'),button=>{button.onclick=async function(){var id=button.getAttribute('data-memory-'+action);var item=featureData.memories[memoryChat].items.filter(i=>i.id===id)[0];if(action==='delete'&&!await askConfirm('删除这条记忆？后续会话将不再注入它，历史聊天记录仍保留。'))return;var result=await featurePost('memory',{key:memoryChat,id,action,kind:item.proposedKind,pinned:!item.pinned},button);if(result)await load();};}));
    if((el=$('pfChat')))el.onchange=function(){rememberDraft('profiles');profileChat=this.value;renderPane();};
    if((el=$('pfSave')))el.onclick=async function(){var value=$('pfModel').value.split('|');var bool=id=>$(id).value==='inherit'?null:$(id).value==='true';var result=await featurePost('profile',{key:profileChat,profile:{personaId:$('pfPersona').value,voiceEnabled:bool('pfVoice'),voiceName:$('pfVoiceName').value,replyChars:Number($('pfChars').value),proactive:bool('pfProactive')},model:value.length===2?{provider:value[0],model:value[1]}:null},this);if(result){toast('对话配置已保存');await load();}};
    if((el=$('dlSave')))el.onclick=async function(){var result=await featurePost('reliability',{mergeMs:Number($('dlMerge').value)},this);if(result)await load();};
    Array.prototype.forEach.call(document.querySelectorAll('[data-delivery-retry]'),button=>{button.onclick=async function(){var id=button.getAttribute('data-delivery-retry');var job=featureData.outbox.filter(j=>j.id===id)[0];if(!await askConfirm(job.status==='unknown'?'平台回执未确认，原消息可能已经送达。核实后仍要重发？':'重新发送这条消息？'))return;var result=await featurePost('retry',{id,confirmUncertain:true},button);if(result){toast('已重新加入发送队列');await load();}};});
    Array.prototype.forEach.call(document.querySelectorAll('[data-inbox-retry]'),button=>{button.onclick=async function(){if(!await askConfirm('重新提交这条输入？如果之前已经生成过回复，可能会再次回复。'))return;var result=await featurePost('inbox-retry',{id:button.getAttribute('data-inbox-retry'),confirmUncertain:true},button);if(result)await load();};});
    if((el=$('afAudit')))el.onchange=function(){rememberDraft('activity');auditId=this.value;renderPane();};
    if((el=$('afWithdraw')))el.onclick=async function(){if(!await askConfirm('向 QQ 申请撤回这轮已确认发送的消息？'))return;var result=await featurePost('withdraw',{id:auditId},this);if(result)$('afResult').textContent=result.results.map(r=>r.messageId+'：'+(r.ok?'已撤回':r.error)).join('；');};
    if((el=$('afRegenerate')))el.onclick=async function(){var id=auditId;var result=await featurePost('regenerate',{id,instruction:$('afInstruction').value},this);if(result){correctionDrafts[id]=result.draft;if(tab==='activity'&&auditId===id){$('afDraft').value=result.draft;rememberDraft('activity');renderDraftNotice();}toast('已生成预览，尚未发送');}};
    if((el=$('afSend')))el.onclick=async function(){if(!$('afDraft').value.trim())return toast('先填写或生成修正版');if(!await askConfirm('把当前修正版发送到这轮回复对应的 QQ 对话？'))return;var result=await featurePost('correction',{id:auditId,text:$('afDraft').value},this);if(result)toast('修正版已加入发送队列');};
    if((el=$('bfExport')))el.onclick=async function(){var result=await featurePost('backup-export',{includeAssets:$('bfAssets').checked,includeMessages:$('bfHistory').checked},this);if(!result)return;var url=URL.createObjectURL(new Blob([JSON.stringify(result.bundle,null,2)],{type:'application/json'}));var anchor=document.createElement('a');anchor.href=url;anchor.download='qq-bridge-backup-'+new Date().toISOString().slice(0,10)+'.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('备份已下载');};
    if((el=$('bfFile')))el.onchange=function(){backupBundle=null;backupToken='';$('bfRestore').disabled=true;$('bfPreviewResult').textContent='';};
    if((el=$('bfPreview')))el.onclick=async function(){var file=$('bfFile').files[0];if(!file)return toast('请选择备份 JSON 文件');try{if(file.size>48*1024*1024)throw new Error('备份文件超过 48MB');backupBundle=JSON.parse(await file.text());var result=await featurePost('backup-preview',{bundle:backupBundle},this);if(result){backupToken=result.token;$('bfRestore').disabled=false;$('bfPreviewResult').textContent='角色 '+result.counts.personae+' 个 · 联系人 '+result.counts.contacts+' 个 · 记忆 '+result.counts.memories+' 条 · 图片 '+result.counts.assets+' 张 · 聊天文字 '+result.counts.messages+' 条。已有角色冲突 '+result.conflicts.personae+' 个，将保留现有内容。默认不恢复访问名单，只有明确勾选后才合并联系人与群白名单；号主权限不恢复。';}}catch(error){backupToken='';toast(error.message);}};
    if((el=$('bfRestore')))el.onclick=async function(){if(!backupToken||!backupBundle)return toast('请先检查备份');if(!await askConfirm('按当前勾选项合并恢复？同 ID 现有角色与记忆会保留，恢复前将保存检查点。'))return;var result=await featurePost('backup-restore',{bundle:backupBundle,token:backupToken,restorePreferences:$('bfPreferences').checked,restoreContacts:$('bfContacts').checked,restoreMessages:$('bfMessages').checked},this);backupToken='';if(result){backupBundle=null;toast('合并恢复完成，恢复前检查点已保存');await load();}else if($('bfRestore'))$('bfRestore').disabled=true;};
  }

  initEnhancements();
  initNavigation();
  applyTheme();
  setInterval(applyTheme, 2500);
  load();
  // The panel lives in an iframe; when the plugin is updated this page would
  // otherwise keep running the old code forever. Reload once the server moves on.
  var panelVersion = '';
  setInterval(function () {
    api('GET', '/im-bridge/status').then(function (v) {
      if (panelVersion === '') panelVersion = v.version;
      else if (v.version !== panelVersion) location.reload();
    }).catch(function () {});
  }, 7000);
  setInterval(function () { void syncLiveSnapshot(); }, 6000);
})();



</script>
</body>
</html>
