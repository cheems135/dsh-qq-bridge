<script>
(function(){
 'use strict';
 var button=document.getElementById('bridgeIssueButton'),panel=document.getElementById('bridgeIssuePanel'),list=document.getElementById('bridgeIssueList'),state=document.getElementById('bridgeIssueState'),soundButton=document.getElementById('bridgeIssueSound');
 var account=null,rows=[],seen=new Set(),audio=null,enabled=false,polling=false;
 try{enabled=localStorage.getItem('qqBridge.issueSound')==='true';}catch(e){}
 function soundLabel(){soundButton.textContent=enabled&&audio&&audio.state==='running'?'关闭错误提示音':enabled?'提示音待启用（点击允许）':'启用错误提示音';}
 function tone(){if(!enabled||!audio||audio.state!=='running')return false;try{var oscillator=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime;oscillator.type='sine';oscillator.frequency.setValueAtTime(720,t);oscillator.frequency.setValueAtTime(540,t+.14);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.12,t+.02);gain.gain.exponentialRampToValueAtTime(.0001,t+.34);oscillator.connect(gain);gain.connect(audio.destination);oscillator.start(t);oscillator.stop(t+.36);return true;}catch(e){state.textContent='提示音暂不可播放，请重新点击启用。';return false;}}
 async function unlock(){var Constructor=window.AudioContext||window.webkitAudioContext;if(!Constructor){state.textContent='此浏览器不支持提示音，仍会显示提醒记录。';return false;}try{if(!audio)audio=new Constructor();await audio.resume();soundLabel();if(audio.state==='running'&&account!==null)state.textContent='已连接 · 提示音已启用';return audio.state==='running';}catch(e){state.textContent='浏览器尚未允许声音，请点击启用错误提示音。';return false;}}
 soundButton.onclick=async function(){if(enabled&&audio&&audio.state==='running'){enabled=false;}else{enabled=true;await unlock();tone();}try{localStorage.setItem('qqBridge.issueSound',String(enabled));}catch(e){}soundLabel();};
 document.addEventListener('pointerdown',function(){if(enabled&&(!audio||audio.state!=='running'))void unlock();},{passive:true});
 button.onclick=function(){if(!panel.open)panel.showModal();};document.getElementById('bridgeIssueClose').onclick=function(){panel.close();};
 function render(){var unread=rows.filter(function(r){return !r.acknowledged;}).length;button.textContent='运行提醒 · '+unread;button.dataset.alert=String(unread>0);list.replaceChildren();rows.forEach(function(row){var item=document.createElement('li'),meta=document.createElement('small'),text=document.createElement('pre');meta.textContent=new Date(row.at).toLocaleString()+' · '+(row.backend==='api'?'API':'本地')+' · '+row.kind+(row.acknowledged?' · 已读':'');text.textContent=row.message;item.append(meta,text);list.append(item);});if(!rows.length){var empty=document.createElement('li');empty.textContent='暂时没有运行报错。';list.append(empty);}}

 var fresh=data.issues.filter(function(row){return !row.acknowledged&&!seen.has(row.id);});rows=data.issues;rows.forEach(function(row){seen.add(row.id);});seen=new Set(Array.from(seen).slice(-240));try{sessionStorage.setItem('qqBridge.issueSeen:'+account,JSON.stringify(Array.from(seen)));}catch(e){}
 state.textContent='已连接 · '+(enabled&&audio&&audio.state==='running'?'提示音已启用':enabled?'提示音待浏览器允许':'提示音未启用');render();if(!changed&&fresh.length){if(!tone()&&enabled)state.textContent='有新报错；浏览器尚未允许声音，请点击启用错误提示音。';}
 }catch(e){state.textContent='提醒记录暂未连接：'+e.message;}finally{polling=false;}}

</script>
