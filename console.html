<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQ 桥接 · 管理面板</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f6f4;
    --panel: #ffffff;
    --panel-2: #fbfaf9;
    --ink: #1c1c1e;
    --ink2: #6e6e73;
    --ink3: #9a9aa0;
    --line: rgba(28,28,30,.07);
    --line2: rgba(28,28,30,.12);
    --soft: rgba(28,28,30,.035);
    --soft2: rgba(28,28,30,.06);
    --accent: #2f6bff;
    --accent-ink: #2458d8;
    --accent-weak: rgba(47,107,255,.08);
    --danger: #d9534f;
    --ok: #17a673;
    --warn: #c98a1e;
    --radius: 18px;
    --radius-sm: 12px;
    --shadow: 0 1px 3px rgba(28,28,30,.05), 0 10px 24px -12px rgba(28,28,30,.10);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: .01em;
  }
  ::selection { background: var(--accent-weak); }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }

  /* ---------- shell ---------- */
  .app { min-height: 100vh; display: grid; grid-template-columns: 212px minmax(0, 1fr); }
  .side {
    position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; gap: 14px;
    padding: 22px 14px; background: transparent;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 4px; }
  .logo {
    width: 32px; height: 32px; border-radius: 10px; flex: none;
    display: grid; place-items: center; color: #fff; font-weight: 650; font-size: 15px;
    background: linear-gradient(150deg, #6f9bff, var(--accent));
    box-shadow: 0 4px 12px -4px rgba(47,107,255,.5);
  }
  .brandText { display: flex; flex-direction: column; line-height: 1.3; }
  .brandText b { font-size: 14.5px; font-weight: 600; }
  .ver { font-size: 11px; color: var(--ink3); font-variant-numeric: tabular-nums; }

  .statusbox { margin: 0 4px; padding: 12px 13px; border-radius: 14px; background: var(--panel); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; font-weight: 500; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 15%, transparent); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 7px; background: var(--soft); font-size: 11.5px; color: var(--ink2); white-space: nowrap; }

  .nav { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .navgroup { font-size: 11px; color: var(--ink3); padding: 14px 12px 5px; letter-spacing: .04em; }
  .tab {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 12px; border: 0; border-radius: 11px;
    background: transparent; box-shadow: none; color: var(--ink2);
    font: inherit; font-size: 14px; text-align: left; cursor: pointer;
    transition: background .16s ease, color .16s ease, box-shadow .16s ease;
  }
  .tab .ico { width: 17px; text-align: center; opacity: .7; font-size: 13px; }
  .tab:hover { background: var(--soft2); color: var(--ink); }
  .tab.on { background: var(--panel); color: var(--ink); font-weight: 550; box-shadow: var(--shadow); }
  .tab.on .ico { opacity: 1; color: var(--accent); }
  .sidefoot { margin-top: auto; padding: 0 4px; }

  .main { min-width: 0; }
  .maininner { max-width: 660px; margin: 0 auto; padding: 34px 26px 96px; animation: rise .22s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(8px);
    background: #1c1c1e; color: #fff; padding: 11px 20px; border-radius: 12px; font-size: 13.5px;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 50;
    box-shadow: 0 16px 40px -12px rgba(0,0,0,.4); max-width: 80vw;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- page head ---------- */
  .pagehead { margin: 0 0 20px; padding: 0 2px; }
  .pagehead h1 { font-size: 22px; font-weight: 650; margin: 0 0 4px; letter-spacing: -.01em; }
  .pagehead p { margin: 0; color: var(--ink2); font-size: 13.5px; }

  /* ---------- content ---------- */
  .card {
    background: var(--panel); border-radius: var(--radius);
    padding: 20px 20px 18px; margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .card h2 {
    font-size: 14.5px; font-weight: 600; color: var(--ink);
    margin: 0 0 6px; display: flex; align-items: center; gap: 8px;
  }
  .card > .muted:first-of-type { margin-top: 0; }
  .card h2 + .muted { margin-top: -2px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; flex-wrap: wrap; }
  .row > * { min-width: 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .row.start { justify-content: flex-start; }
  .muted { color: var(--ink2); font-size: 13px; line-height: 1.65; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; color: var(--ink2); }

  /* 长路径：标签一行，值另起一行，永不撑破布局 */
  .kv { display: flex; flex-direction: column; gap: 3px; padding: 10px 0; min-width: 0; }
  .kv > span { font-size: 12.5px; color: var(--ink2); }
  .kv + .kv { border-top: 1px solid var(--line); }
  code.path {
    display: block; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.6; color: var(--ink);
    background: var(--panel-2); border-radius: 9px; padding: 8px 10px;
    overflow-wrap: anywhere; word-break: break-all; white-space: normal;
  }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(136px, 1fr)); gap: 10px; }
  .stat { border-radius: 14px; padding: 14px 16px; background: var(--panel-2); }
  .stat b { display: block; font-size: 20px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--ink3); }

  input, textarea, select {
    font: inherit; font-size: 14px; color: inherit; width: 100%;
    background: var(--panel-2); border: 1px solid transparent;
    border-radius: var(--radius-sm); padding: 10px 13px; outline: none;
    transition: background .16s, border-color .16s, box-shadow .16s;
  }
  input:hover, textarea:hover, select:hover { background: var(--soft); }
  input:focus, textarea:focus, select:focus { background: var(--panel); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-weak); }
  textarea { min-height: 104px; resize: vertical; line-height: 1.7; }
  label.field { display: block; font-size: 12.5px; color: var(--ink2); }
  label.field > input, label.field > button { margin-top: 6px; }

  button {
    font: inherit; font-size: 13.5px; cursor: pointer;
    border-radius: var(--radius-sm); border: 0;
    background: var(--soft); color: var(--ink); padding: 8px 15px;
    transition: background .16s, color .16s, transform .06s, box-shadow .16s;
  }
  button:hover:not(:disabled) { background: var(--soft2); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--accent-weak); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: #fff; box-shadow: 0 6px 16px -8px rgba(47,107,255,.7); }
  button.primary:hover:not(:disabled) { background: var(--accent-ink); }
  button.danger { background: transparent; color: var(--danger); }
  button.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 9%, transparent); }
  button.ghost { background: transparent; }
  button.ghost:hover:not(:disabled) { background: var(--soft); }
  button.small { padding: 6px 12px; font-size: 12.5px; border-radius: 10px; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .persona { background: var(--panel-2); border-radius: 14px; padding: 16px 17px; margin-bottom: 10px; }
  .persona.on { background: var(--accent-weak); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
  .persona h3 { margin: 0 0 2px; font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 11px; border-radius: 6px; padding: 2px 7px; background: var(--soft2); color: var(--ink2); font-weight: 500; }
  .persona pre { white-space: pre-wrap; font-size: 12.5px; color: var(--ink2); margin: 8px 0 0; max-height: 110px; overflow: auto; line-height: 1.7; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
  .sticker { background: var(--panel-2); border-radius: 14px; padding: 8px; text-align: center; transition: transform .16s, background .16s; }
  .sticker:hover { transform: translateY(-2px); background: var(--soft); }
  .sticker img { width: 100%; height: 86px; object-fit: contain; border-radius: 10px; }
  .sticker .name { font-size: 11.5px; margin-top: 6px; word-break: break-all; color: var(--ink2); }
  .sticker .acts { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }

  .empty { text-align: center; color: var(--ink3); font-size: 13px; padding: 30px 12px; border-radius: 14px; background: var(--panel-2); }

  .msgs { display: flex; flex-direction: column; gap: 8px; }
  .msg { border-radius: 14px; padding: 12px 14px; background: var(--panel-2); }
  .msg.in { background: var(--soft); }
  .msg .meta { font-size: 11.5px; color: var(--ink3); margin-bottom: 4px; display: flex; gap: 8px; }
  .msg .body { white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .msg img { max-width: 170px; border-radius: 10px; margin-top: 6px; }

  .banner {
    background: color-mix(in srgb, var(--warn) 9%, transparent);
    border-radius: 14px; padding: 14px 16px; font-size: 13px; line-height: 1.7; color: var(--ink2);
  }
  .banner b { color: var(--warn); }

  pre.log {
    max-height: 230px; overflow: auto; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11.5px; line-height: 1.7; white-space: pre-wrap; margin: 10px 0 0;
    color: var(--ink2); background: var(--panel-2); border-radius: 12px; padding: 12px 14px;
  }

  .seg { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 2px; }
  .seg button { border-radius: 8px; padding: 5px 12px; font-size: 12.5px; background: transparent; }
  .seg button.on { background: var(--panel); font-weight: 550; box-shadow: var(--shadow); }

  /* ---------- dark ---------- */
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #101012;
    --panel: #1a1a1e;
    --panel-2: #212127;
    --ink: #f2f2f5;
    --ink2: #a5a5b0;
    --ink3: #78787f;
    --line: rgba(255,255,255,.07);
    --line2: rgba(255,255,255,.13);
    --soft: rgba(255,255,255,.05);
    --soft2: rgba(255,255,255,.09);
    --accent: #6f9bff;
    --accent-ink: #8fb0ff;
    --accent-weak: rgba(111,155,255,.14);
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 28px -14px rgba(0,0,0,.7);
  }
  html[data-theme="dark"] .toast { background: #2c2c33; }
  html[data-theme="dark"] button.primary { color: #0f0f12; }
  html[data-theme="dark"] .logo { background: linear-gradient(150deg, #7aa2ff, #3f6fe8); }

  /* ---------- responsive ---------- */
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    .side {
      position: sticky; top: 0; z-index: 30; height: auto;
      flex-direction: row; align-items: center; gap: 10px;
      padding: 10px 12px; background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
    }
    .statusbox { display: none; }
    .brand { flex: none; }
    .brandText { display: none; }
    /* 顶层目录：两行网格，不再横向滚动 */
    .nav {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px; margin: 0; flex: 1; min-width: 0;
    }
    .navgroup { display: none; }
    .tab {
      width: 100%; justify-content: center; padding: 7px 6px;
      font-size: 12.5px; white-space: nowrap; text-align: center;
      border-radius: 9px;
    }
    .tab .ico { display: none; }
    .tab.on { box-shadow: 0 1px 3px rgba(28,28,30,.12); }
    .sidefoot { margin: 0; flex: none; }
    .sidefoot button { padding: 7px 10px; }
    .maininner { padding: 20px 16px 80px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .pagehead h1 { font-size: 19px; }
  }
  @media (max-width: 430px) {
    .nav { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .tab { font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">Q</div>
      <div class="brandText"><b>QQ 桥接</b><span class="ver" id="ver">v—</span></div>
    </div>

    <div class="statusbox">
      <span class="pill"><span class="dot" id="dot"></span><span id="pillText">…</span></span>
      <div class="chips">
        <span class="chip" id="chipIq">档位 —</span>
        <span class="chip" id="chipVoice">语音 —</span>
      </div>
    </div>

    <nav class="nav" id="tabs">
      <div class="navgroup">对话</div>
      <button class="tab on" data-tab="overview"><span class="ico">◎</span>概览</button>
      <button class="tab" data-tab="send"><span class="ico">✈</span>发消息</button>
      <button class="tab" data-tab="monitor"><span class="ico">☰</span>监听</button>
      <div class="navgroup">角色</div>
      <button class="tab" data-tab="persona"><span class="ico">☺</span>人设</button>
      <button class="tab" data-tab="whitelist"><span class="ico">✓</span>联系人</button>
      <button class="tab" data-tab="sticker"><span class="ico">▣</span>素材</button>
      <div class="navgroup">系统</div>
      <button class="tab" data-tab="memory"><span class="ico">◫</span>记忆</button>
      <button class="tab" data-tab="model"><span class="ico">◇</span>模型</button>
    </nav>

    <div class="sidefoot">
      <button class="ghost small" id="refresh">刷新数据</button>
    </div>
  </aside>

  <main class="main">
    <div class="maininner"><div id="pane"></div></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var data = null;
  var login = null;
  var monitor = null;
  var models = null;
  var storage = null;
  var presets = [];
  var viewPreset = '';
  var msgChat = 'all';
  var sFilter = '';
  var pickedStickers = {};
  var editingId = '';
  var tab = 'overview';
  var msgFilter = 'all';
  var monitorTimer = null;
  var toastTimer = null;

  function $(id) { return document.getElementById(id); }

  /** Follow the host page's theme when embedded, the OS when opened standalone. */
  function applyTheme() {
    var dark = null;
    try {
      var parentDoc = window.parent && window.parent !== window ? window.parent.document : null;
      var root = parentDoc ? parentDoc.documentElement : null;
      if (root && parentDoc.body) {
        var marker = ((root.className || '') + ' ' + (root.getAttribute('data-theme') || '') + ' ' + (root.getAttribute('data-color-mode') || '')).toLowerCase();
        if (marker.indexOf('dark') !== -1) dark = true;
        else if (marker.indexOf('light') !== -1) dark = false;
        else {
          var bg = window.parent.getComputedStyle(parentDoc.body).backgroundColor || '';
          var parts = bg.match(/\d+/g);
          if (parts && parts.length >= 3) {
            dark = (Number(parts[0]) * 0.299 + Number(parts[1]) * 0.587 + Number(parts[2]) * 0.114) < 128;
          }
        }
      }
    } catch (e) {
      dark = null;
    }
    if (dark === null) dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('on'); }, 2000);
  }
  function api(method, url, payload) {
    return fetch(url, {
      method: method,
      headers: payload ? { 'content-type': 'application/json' } : undefined,
      body: payload ? JSON.stringify(payload) : undefined,
      cache: 'no-store'
    }).then(function (r) {
      return r.json().then(function (v) {
        if (!r.ok) throw new Error(v && v.error ? v.error : ('HTTP ' + r.status));
        return v;
      });
    });
  }

  function load() {
    return Promise.all([
      api('GET', '/im-bridge/settings'),
      api('GET', '/im-bridge/login'),
      api('GET', '/im-bridge/messages'),
      api('GET', '/im-bridge/models'),
      api('GET', '/im-bridge/presets'),
      api('GET', '/im-bridge/storage')
    ]).then(function (r) {
      data = r[0]; login = r[1]; monitor = r[2]; models = r[3];
      presets = (r[4] && r[4].presets) || [];
      storage = r[5];
      renderPill(); renderPane();
    }).catch(function (e) { toast('读取失败：' + e.message); });
  }

  function renderPill() {
    var st = data.status;
    $('dot').style.background = st.connected ? '#2fbf71' : '#d94b4b';
    $('pillText').textContent = st.connected ? ('已连接 · ' + (st.selfId || '?')) : '未连接';
    if ($('ver')) $('ver').textContent = 'v' + (st.version || '—');
    var effortLabel = { off: '省', low: '标准', high: '高', max: '最高' };
    if ($('chipIq')) $('chipIq').textContent = '档位 ' + (effortLabel[st.effectiveEffort] || st.effectiveEffort || '—');
    if ($('chipVoice')) $('chipVoice').textContent = '语音 ' + (data.settings && data.settings.voice && data.settings.voice.enabled ? '开' : '关');
  }

  var PAGE_HEADS = {
    overview: ['概览', '连接状态、登录、机器人账号和最近日志'],
    send: ['发消息', '用她的身份直接发一条，不经过模型'],
    monitor: ['监听', '你和她的往来记录，每 2 秒自动刷新'],
    persona: ['人设', '底层性格、预设与自定义人设，改完下一条消息生效'],
    whitelist: ['联系人', '号主、允许私聊的 QQ 和群'],
    sticker: ['素材', '表情包、联网搜图和语音输出'],
    memory: ['记忆', '压缩规则、已存记忆和存放位置'],
    model: ['模型', '智力档位、模型、主动行为与搜索']
  };

  function renderPane() {
    var html = '';
    if (tab === 'overview') html = viewOverview();
    if (tab === 'send') html = viewSend();
    if (tab === 'persona') html = viewPersona();
    if (tab === 'whitelist') html = viewWhitelist();
    if (tab === 'sticker') html = viewSticker();
    if (tab === 'monitor') html = viewMonitor();
    if (tab === 'memory') html = viewMemory();
    if (tab === 'model') html = viewModelSettings();
    var head = PAGE_HEADS[tab] || ['', ''];
    html = '<div class="pagehead"><h1>' + esc(head[0]) + '</h1><p>' + esc(head[1]) + '</p></div>' + html;
    // The monitor refreshes every couple of seconds; without this the list
    // would jump back to the top while being read.
    var keepScroll = window.scrollY;
    $('pane').innerHTML = html;
    bind();
    window.scrollTo(0, keepScroll);
    if (tab === 'model') renderModelPickers();
    if (tab === 'overview') loadLog();
    if (monitorTimer) { clearInterval(monitorTimer); monitorTimer = null; }
    if (tab === 'monitor') {
      monitorTimer = setInterval(function () {
        if (tab !== 'monitor') return;
        api('GET', '/im-bridge/messages').then(function (v) {
          monitor = v;
          renderPane();
        }).catch(function () {});
      }, 2000);
    }
  }

  function row(label, value) {
    return '<div class="row"><span>' + label + '</span><span class="muted">' + value + '</span></div>';
  }

  function viewSend() {
    var st = data.status;
    var targets = [];
    (st.chats || []).forEach(function (c) { targets.push(c.key); });
    (st.allowUsers || []).forEach(function (u) {
      var key = 'private:' + u;
      if (targets.indexOf(key) === -1) targets.push(key);
    });
    (st.allowGroups || []).forEach(function (g) {
      var key = 'group:' + g;
      if (targets.indexOf(key) === -1) targets.push(key);
    });
    var files = data.stickerFiles || [];
    var out = '<div class="card"><h2>以她的身份发一条</h2>' +
      '<div class="muted" style="margin-bottom:10px">直接调用 NapCat 发送，不经过模型——用来纠正她的话、补发提示、或者手动喂一张图。</div>';
    out += '<label class="field">发送对象</label><select id="sendTarget">' +
      targets.map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; }).join('') +

  function fmtSize(bytes) {
    var n = Number(bytes) || 0;
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  function loadLog() {
    var box = $('logBox');
    if (!box) return;
    api('GET', '/im-bridge/log?lines=40')
      .then(function (v) { box.textContent = (v.lines || []).join('\n') || '（空）'; box.scrollTop = box.scrollHeight; })
      .catch(function (e) { box.textContent = '读取失败：' + e.message; });
  }

  function loadQr() {
    var box = $('qrBox');
    if (!box) return;
    var img = new Image();
    img.onload = function () {
      img.style.maxWidth = '220px'; img.style.borderRadius = '12px'; img.style.border = '1px solid var(--line)';
      img.style.cursor = 'pointer'; img.title = '点击刷新';
      img.onclick = function () { img.src = '/im-bridge/qr?t=' + Date.now(); };

    };
    img.onerror = function () { box.innerHTML = '<div class="muted">还没有二维码：先点「本地快速登录」。</div>'; };
    img.src = '/im-bridge/qr?t=' + Date.now();

  function renderModelPickers() {
    var provider = $('mProvider');
    var modelSelect = $('mModel');
    if (!provider || !modelSelect) return;
    // 用面板真实生效的那一组，而不是目录里的默认值；否则下拉显示的和实际用的会不一致。
    var cur = (data.status && data.status.model) || (models && (models.current || models.default)) || {};
    provider.innerHTML = '';
    ((models && models.groups) || []).forEach(function (g) {
      var opt = document.createElement('option');
      opt.value = g.id; opt.textContent = g.name || g.id;
      if (g.id === cur.provider) opt.selected = true;
      provider.appendChild(opt);
    });
    if (!provider.options.length) {
      provider.innerHTML = '<option value="' + esc(cur.provider || '') + '">' + esc(cur.provider || '无可用模型') + '</option>';
    }
    fillModels(cur.model);
    if ($('modelCur')) {
      $('modelCur').textContent =
        (cur.provider || '?') + ' / ' + (cur.model || '?') + (cur.reasoningEffort ? ' · ' + cur.reasoningEffort : '');
    }
  }

  function fillModels(preferred) {
    var provider = $('mProvider');
    var modelSelect = $('mModel');
    if (!provider || !modelSelect) return;
    var groups = (models && models.groups) || [];
    var group = groups.filter(function (g) { return g.id === provider.value; })[0];
    modelSelect.innerHTML = '';
    ((group && group.models) || []).forEach(function (m) {
      var opt = document.createElement('option');
      opt.value = m.id; opt.textContent = m.name || m.id;
      if (m.id === preferred) opt.selected = true;
      modelSelect.appendChild(opt);
    });
    if (!modelSelect.options.length) {
      modelSelect.innerHTML = '<option value="' + esc(preferred || '') + '">' + esc(preferred || '无可用模型') + '</option>';
    }
  }

  function bind() {
    var el;
    if ((el = $('sendTarget'))) el.onchange = function () {
      $('sendCustom').style.display = el.value === '__custom' ? '' : 'none';
    };
    if ((el = $('sendGo'))) el.onclick = function () {
      var target = $('sendTarget').value === '__custom' ? ($('sendCustom').value || '').trim() : $('sendTarget').value;
      if (!target) { toast('先选发送对象'); return; }
      var payload = {
        target: target,
        text: ($('sendText').value || '').trim(),
        voice: ($('sendVoice').value || '').trim(),
        sticker: $('sendSticker').value || ''
      };
      if (!payload.text && !payload.voice && !payload.sticker) { toast('没有要发的内容'); return; }
      el.disabled = true;
      $('sendOut').textContent = '发送中…';
      api('POST', '/im-bridge/send', payload)
        .then(function (v) { $('sendOut').textContent = '已发送（' + v.segments.join('+') + '）→ ' + v.target; toast('已发送'); })
        .catch(function (e) { $('sendOut').textContent = '失败：' + e.message; })
        .finally(function () { el.disabled = false; });
    };
    [['sendFillSorry', '刚才说错了，别当真'], ['sendFillBusy', '我去忙一会儿，回头找你'], ['sendFillNight', '睡了，晚安']].forEach(function (pair) {
      var btn = $(pair[0]);
      if (btn) btn.onclick = function () { $('sendText').value = pair[1]; };
    });
    if ((el = $('btnStart'))) el.onclick = function () {
      el.disabled = true;
      $('loginHint').textContent = '已请求启动，若弹 UAC 请点「是」…';
      api('POST', '/im-bridge/login', { action: 'start' }).then(function (v) {
        $('loginHint').textContent = v.already ? '本来就在运行' : '已拉起，登录后自动刷新';
        setTimeout(load, 6000);
        setTimeout(function () { if (el) el.disabled = false; }, 6000);
      }).catch(function (e) { $('loginHint').textContent = '启动失败：' + e.message; el.disabled = false; });
    };
    if ((el = $('btnRegister'))) el.onclick = function () {
      $('loginHint').textContent = '弹 UAC 时点「是」，之后启动就不用再点了';
      api('POST', '/im-bridge/login', { action: 'register' })
        .then(function () { toast('已请求注册，请在 UAC 窗口点「是」'); })
        .catch(function (e) { $('loginHint').textContent = '注册失败：' + e.message; });
    };
    if ((el = $('btnQrRefresh'))) el.onclick = loadQr;
    loadQr();
    if ((el = $('autoStartToggle'))) el.onclick = function () {
      var next = !data.status.autoStart;
      el.disabled = true;
      api('POST', '/im-bridge/settings', { autoStart: next })
        .then(function () { toast(next ? '已开启开机自启' : '已关闭开机自启'); load(); })
        .catch(function (e) { toast('设置失败：' + e.message); })
        .finally(function () { el.disabled = false; });

    };
    if ((el = $('memSave'))) el.onclick = function () {
      api('POST', '/im-bridge/settings', { memory: { everyTurns: Number($('memTurns').value), maxChars: Number($('memChars').value) } })
        .then(function () { toast('已保存'); load(); });
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-memcompact]'), function (btn) {
      btn.onclick = function () {
        var key = btn.getAttribute('data-memcompact');
        btn.disabled = true;
        btn.textContent = '压缩中…';
        api('POST', '/im-bridge/memory', { action: 'compact', key: key })
          .then(function () { toast('已生成记忆'); load(); })
          .catch(function (e) { toast('失败：' + e.message); btn.disabled = false; btn.textContent = '立即压缩'; });
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-memclear]'), function (btn) {
      btn.onclick = function () {
        if (!confirm('清除这段记忆？')) return;
        api('POST', '/im-bridge/memory', { action: 'clear', key: btn.getAttribute('data-memclear') })
          .then(function () { toast('已清除'); load(); });
      };
    });
    if ((el = $('cacheMove'))) el.onclick = function () {
      var dir = ($('cacheInput').value || '').trim();
      if (!dir) { toast('填一个路径'); return; }
      if (!confirm('把缓存迁移到 ' + dir + ' ？会移动日志、监听历史、语音和表情包。')) return;
      el.disabled = true;
      $('cacheOut').textContent = '迁移中…';
      api('POST', '/im-bridge/settings', { cacheDir: dir })
        .then(function () { $('cacheOut').textContent = '已迁移到 ' + dir; toast('已迁移'); load(); })
        .catch(function (e) { $('cacheOut').textContent = '失败：' + e.message; })
        .finally(function () { el.disabled = false; });
    };
    if ((el = $('cacheDefault'))) el.onclick = function () {
      api('POST', '/im-bridge/settings', { cacheDir: '' })
        .then(function () { toast('已恢复默认路径'); load(); });
    };
    if ((el = $('cacheClean'))) el.onclick = function () {
      if (!confirm('清理语音、旧监听图片和日志？表情包和设置不动。')) return;
      api('POST', '/im-bridge/storage', { action: 'clean' })
        .then(function (v) { toast('已清理：' + (v.removed || []).join('、')); load(); })
        .catch(function (e) { toast('清理失败：' + e.message); });
    };
    if ((el = $('vSaveEngine'))) el.onclick = function () {
      api('POST', '/im-bridge/settings', {
        voice: {
          engine: $('vEngine').value,
          edgeVoice: ($('vEdgeVoice').value || '').trim(),
          customUrl: ($('vCustomUrl').value || '').trim(),
          customVoice: ($('vCustomVoice').value || '').trim()
        }
      }).then(function () { toast('已保存'); load(); });
    };
    if ((el = $('searxSave'))) el.onclick = function () {
      api('POST', '/im-bridge/settings', {
        search: {
          engine: $('seEngine').value,
          searxUrl: ($('searxUrl').value || '').trim(),
          customUrl: ($('seCustomUrl').value || '').trim()
        }
      }).then(function () { toast('已保存'); load(); });
    };
    if ((el = $('memDirSave'))) el.onclick = function () {
      api('POST', '/im-bridge/settings', { memoryDir: ($('memDir').value || '').trim() })
        .then(function () { toast('记忆位置已更新'); load(); })
        .catch(function (e) { toast('失败：' + e.message); });
    };
    if ((el = $('vSamplesBtn'))) el.onclick = function () {
      el.disabled = true;
      $('vSamples').innerHTML = '<div class="muted">生成中，约 10–20 秒…</div>';
      api('POST', '/im-bridge/voice/samples', { text: ($('vText').value || '').trim() || '喂，今天吃什么，我饿了' })
        .then(function (v) {
          var target = (data.status.chats[0] && data.status.chats[0].key) || ('private:' + (data.status.allowUsers[0] || ''));
          var html = v.samples.map(function (s) {
            if (!s.ok) return '<div class="row"><span>' + esc(s.label) + '</span><span class="muted">合成失败</span></div>';
            return '<div class="row"><span>' + esc(s.label) + '</span><span class="btnrow">' +
              '<audio controls preload="none" src="/im-bridge/audio?name=' + encodeURIComponent(s.name) + '" style="height:34px"></audio>' +
              '<button class="small" data-sendsample="' + esc(s.name) + '" data-target="' + esc(target) + '">发到QQ</button></span></div>';
          }).join('');
          $('vSamples').innerHTML = html;
          Array.prototype.forEach.call(document.querySelectorAll('[data-sendsample]'), function (btn) {
            btn.onclick = function () {
              api('POST', '/im-bridge/audio', { name: btn.getAttribute('data-sendsample'), target: btn.getAttribute('data-target') })
                .then(function () { toast('已发到 QQ'); })
                .catch(function (e) { toast('发送失败：' + e.message); });
            };
          });
        })
        .catch(function (e) { $('vSamples').textContent = '失败：' + e.message; })
        .finally(function () { el.disabled = false; });
    };
    if ((el = $('vToggle'))) el.onclick = function () {
      api('POST', '/im-bridge/settings', { voice: { enabled: !(data.settings.voice && data.settings.voice.enabled) } })
        .then(function () { toast('已保存'); load(); });
    };
    if ((el = $('vTest'))) el.onclick = function () {
      el.disabled = true;
      $('vOut').textContent = '合成并发送中…';
      api('POST', '/im-bridge/voice', { action: 'test', text: ($('vText').value || '喂，听得见吗？') })
        .then(function (v) { $('vOut').textContent = '已发到 ' + v.target + '（' + v.file + '）'; })
        .catch(function (e) { $('vOut').textContent = '失败：' + e.message; })
        .finally(function () { el.disabled = false; });
    };
    if ((el = $('aiPersonaBtn'))) el.onclick = function () {
      var desc = ($('aiPersonaDesc').value || '').trim();
      if (!desc) { toast('先写一句描述'); return; }
      el.disabled = true;
      $('aiPersonaOut').textContent = '生成中…（约 3–10 秒）';
      api('POST', '/im-bridge/ai/persona', { description: desc }).then(function (v) {
        $('aiPersonaOut').innerHTML = '<b>' + esc(v.persona.name) + '</b> · ' + esc(v.persona.preset) + '\n' + esc(v.persona.prompt) +
          '\n\n<button class="primary small" id="aiAdopt">采用这个人设</button>';
        var adopt = $('aiAdopt');
        if (adopt) adopt.onclick = function () {
          var personae = (data.settings.personae || []).slice();
          personae.push({ id: 'p' + Date.now(), name: v.persona.name, preset: v.persona.preset, prompt: v.persona.prompt });
          api('POST', '/im-bridge/settings', { personae: personae }).then(function () { toast('已加入列表'); load(); });
        };
      }).catch(function (e) { $('aiPersonaOut').textContent = '失败：' + e.message; })
        .finally(function () { el.disabled = false; });
    };
    if ((el = $('aiStickerBtn'))) el.onclick = function () {
      var query = ($('aiStickerQuery').value || '').trim();
      if (!query) { toast('先写关键词'); return; }
      el.disabled = true;
      $('aiStickerOut').textContent = '搜索中…';
      api('POST', '/im-bridge/ai/stickers', { query: query }).then(function (v) {
        $('aiStickerOut').textContent = '已添加：' + v.added.join('、');
        toast('已添加 ' + v.added.length + ' 张'); load();
      }).catch(function (e) { $('aiStickerOut').textContent = '失败：' + e.message; })
        .finally(function () { el.disabled = false; });
    };
  }

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
    btn.onclick = function () {
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) { b.classList.remove('on'); });
      btn.classList.add('on');
      tab = btn.getAttribute('data-tab');
      renderPane();
    };
  });
  $('refresh').onclick = load;
  applyTheme();
  setInterval(applyTheme, 2500);
  load();
  // The panel lives in an iframe; when the plugin is updated this page would
  // otherwise keep running the old code forever. Reload once the server moves on.
  var panelVersion = '';
  setInterval(function () {
    api('GET', '/im-bridge/status').then(function (v) {
      if (panelVersion === '') panelVersion = v.version;
      else if (v.version !== panelVersion) location.reload();
    }).catch(function () {});
  }, 7000);
  setInterval(function () {
    api('GET', '/im-bridge/settings').then(function (v) { data = v; renderPill(); }).catch(function () {});
  }, 6000);
})();
</script>
</body>
</html>
